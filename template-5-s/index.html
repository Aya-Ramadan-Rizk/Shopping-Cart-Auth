<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Shopping cart</title>
        <link rel="stylesheet" href="css/all.css">
        <link rel="stylesheet" href="css/style.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <!-- -------------------------------------------------- header -------------------------------------------------- -->
        <header for="open">
            <div class="container-header">
                <div class="header-content">
                    <a href="index.html" class="brand"><i class="fa-solid fa-house" title="Shopping"></i></a>
                    <nav>
                        <ul id="user_info">
                            <li><a href="#" id="user"></a></li><!-- اسم المستخدم -->
                            <li class="cart">
                                <i class="fa-solid fa-cart-shopping"></i>
                                <span class="badge"></span><!-- /badge -->   <!-- الرقم-->
                                <div class="veiw-product">
                                    <div></div>
                                    <a href="cart-products.html">Veiw All Products</a>
                                </div><!-- /veiw-product -->
                            </li><!-- /cart -->
                            <li><a href="#" id="logOut"><i class="fa-solid fa-user-xmark" title="LogOut"></i></a></li>
                        </ul><!-- /user_info -->
                        <ul id="links">
                            <li><a href="login.html"><i class="fa-solid fa-user-check" title="Sign In"></i></a></li>
                            <li><a href="register.html"><i class="fa-solid fa-user-plus" title="Sign Up"></i></a></li>
                        </ul><!-- /links -->
                    </nav>
                </div><!-- /header-content -->
            </div><!-- /container-header -->
        </header>
        <!-- -------------------------------------------------- /header -------------------------------------------------- -->
    <!-- ------------------------------------------------------------------ section-1 ------------------------------------------------------------------ -->
    <section class="section-1">
        <div class="section-1-content">
            <!-- --------------------------------- form --------------------------------- -->
            <form class="d-block d-sm-flex">
                <div class="section-1-parent-search d-flex form-control" style="background-color: #f5e0ff; box-shadow: 0 3px 8px #cc99ff40; border: .1rem solid #e0b3ff;">
                    <input class="form-control me-2" type="text" placeholder="Search products" id="search" dir="auto"/>
                </div>
            </form>
            <!-- --------------------------------- /form --------------------------------- -->
        </div><!-- /section-1-content -->
    </section><!-- /section-1 -->
    <!-- ------------------------------------------------------------------ /section-1 ------------------------------------------------------------------ -->
    <!-- ------------------------------------------------------------------ section-2 ------------------------------------------------------------------ -->
    <section class="section-2">
        <div class="container section-2-content">
            <div id="notfound" class="section-2-notfound" style="display: none">
                <p>Sorry, the product is currently unavailable.</p>
            </div><!-- /section-2-notfound -->
            <div class="Home">
                <div class="container">
                    <div class="products"></div><!-- /products -->
                </div>
            </div><!-- /Home -->
        </div><!-- /container -->
    </section><!-- /section-2 -->
    <!-- ------------------------------------------------------------------ /section-2 ------------------------------------------------------------------ -->

        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <script src="js/script.js"></script>
        <script src="js/user.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
