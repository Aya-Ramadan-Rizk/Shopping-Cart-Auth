<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login page</title>
        <link rel="stylesheet" href="css/all.css">
        <link rel="stylesheet" href="css/style.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <!-- -------------------------------------------------- header -------------------------------------------------- -->
        <header>
            <div class="container-header">
                <div class="header-content">
                    <a href="index.html" class="brand"><i class="fa-solid fa-house" title="Shopping"></i></a>
                    <nav>
                        <ul id="user_info">
                            <li><a href="#" id="user"></a></li>
                            
                        </ul><!-- /user_info -->
                        <ul id="links">
                            <li><a href="login.html"><i class="fa-solid fa-user-check" title="Sign In"></i></a></li>
                            <li><a href="register.html"><i class="fa-solid fa-user-plus" title="Sign Up"></i></a></li>
                        </ul><!-- /links -->
                    </nav>
                </div><!-- /header-content -->
            </div><!-- /container-header -->
        </header>
        <!-- -------------------------------------------------- /header -------------------------------------------------- -->
        <!-- -------------------------------------------------- section-form -------------------------------------------------- -->
        <section class="section-form">
            <!-- ------------------------------------------------ // ------------------------------------------------ -->
            <div class="section-form-parent-1">
                <h3>Legends Preserved, Stories Told.</h3>
                <div class="section-form-icon-2">
                    <i class="fa-solid fa-quote-left"></i>
                </div><!-- /section-form-icon-2 -->
                <div class="section-form-p-1">
                    <p>Discover iconic film treasures and timeless stories brought to life</p>
                </div><!-- /section-form-p-1 -->
            </div><!-- /section-form-parent-1 -->
            <!-- ------------------------------------------------ // ------------------------------------------------ -->
            <div class="section-form-parent-2">
                <form class="section-form-sing-in">
                    <div class="section-form-register">
                        <p><i class="fa-solid fa-shield-halved"></i> Your data is protected.</p>
                    </div><!-- /section-form-register -->
                    <h3>Welcome back!</h3>
                    <h2>Login page</h2>
                    <input type="text" placeholder="Enter your username" id="username">
                    <div class="box">
                        <input type="password" placeholder="Enter your password" id="password">
                        <input type="checkbox" id="show">
                        <label for="show" class="eye-1"><i class="fa-regular fa-eye"></i></label>
                        <label for="show" class="eye-2"><i class="fa-regular fa-eye-slash"></i></label>
                    </div>
                    <input type="submit" id="sign_up">
                </form>
            </div><!-- /section-form-parent-2 -->
            <!-- ------------------------------------------------ // ------------------------------------------------ -->
        </section><!-- /section-form -->
        <!-- -------------------------------------------------- /section-form -------------------------------------------------- -->
        

        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <script src="js/login.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
